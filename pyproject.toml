[project]
name = "product-extract"
version = "0.1.0"
description = "KAN-65: 문서 파싱(01) · 클래스 매핑(02) · 속성 추출(03) 구현"
requires-python = ">=3.11,<3.13"
dependencies = [
    "docling>=2.40",
    "pdfplumber>=0.11",
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
    "pypdfium2>=4.30",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "streamlit>=1.40",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extractor"]
